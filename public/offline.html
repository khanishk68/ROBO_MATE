<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | ROBO MATES</title>
  <style>
    body {
      background-color: #080E1C;
      color: #E5F3FF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      box-sizing: border-box;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 8px 0;
      background: linear-gradient(135deg, #2563EB, #38BDF8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94A3B8;
      font-size: 14px;
      max-width: 380px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .btn {
      background: #2563EB;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover {
      background: #1D4ED8;
    }
  </style>
</head>
<body>
  <div class="icon">🤖</div>
  <h1>ROBO MATES is Offline</h1>
  <p>You appear to be without an internet connection. Previously cached roadmaps and study notes remain safe. Connect to sync your progress.</p>
  <button class="btn" onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
